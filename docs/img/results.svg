<title id="t">Rain barely moves taxi demand at JFK or Central Park</title><desc id="d">Change in trips per day against dry days in the same month and weekday, with 95% intervals. Any rain: JFK +1.0% (−1.0% to +3.2%), Central Park −1.2% (−3.2% to +1.1%), 312 days; Light rain: JFK +1.3% (−1.1% to +3.8%), Central Park −0.2% (−2.7% to +2.5%), 122 days; Moderate rain: JFK +0.8% (−1.8% to +3.5%), Central Park −0.9% (−3.7% to +2.0%), 82 days; Heavy rain: JFK +1.0% (−2.5% to +4.7%), Central Park −2.5% (−6.7% to +2.4%), 108 days; Snow: JFK −8.4% (−18.8% to +3.5%), Central Park −4.8% (−9.6% to −0.9%), 23 days; Freezing: JFK −3.3% (−12.1% to +5.0%), Central Park −3.3% (−9.7% to +0.7%), 37 days; Hot: JFK +4.3% (−0.3% to +8.8%), Central Park +5.9% (+2.3% to +9.2%), 38 days.</desc>
